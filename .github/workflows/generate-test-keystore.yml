name: Generate Test Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate test keystore
        env:
          STORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TEST_KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -keystore test-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias vreyse-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=V Reyse Test, O=V Reyse, C=RU"

      - name: Upload test keystore
        uses: actions/upload-artifact@v4
        with:
          name: vreyse-test-keystore
          path: test-keystore.jks
          retention-days: 1
