name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json www/manifest.json
          cp sw.js www/sw.js
          cp icon-192.png www/icon-192.png
          cp icon-512.png www/icon-512.png

      - name: Create Android project
        run: npx cap add android

      - name: Add Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Restore permanent keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/vreyse.jks

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleDebug
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" sign \
            --ks app/vreyse.jks \
            --ks-key-alias test \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out app/build/outputs/apk/debug/v-reyse-signed.apk \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature
        working-directory: android
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/v-reyse-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: v-reyse-signed-apk
          path: android/app/build/outputs/apk/debug/v-reyse-signed.apk
