<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Трекер принтов</title>
<style>
  :root{
    --paper:#EDE6D6;
    --paper-line:#C9BCA0;
    --ink:#2B2B2B;
    --ink-soft:#8a8171;
    --white:#FBF8F2;
    --blue:#3B5BA5;
    --red:#B23A2E;
    --mustard:#B8842A;
    --green:#4C7A54;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(to bottom, transparent, transparent 27px,
        rgba(201,188,160,0.35) 27px, rgba(201,188,160,0.35) 28px),
      var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 100px;}

  header.top{display:flex;justify-content:space-between;align-items:flex-start;
    padding-bottom:14px;margin-bottom:14px;border-bottom:2px dashed var(--paper-line);}
  header.top h1{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;
    font-size:26px;margin:0;letter-spacing:0.2px;}
  header.top .sub{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .role-chip{font-size:12px;background:var(--white);border:1px solid var(--paper-line);
    padding:5px 10px;border-radius:3px;color:var(--ink);cursor:pointer;white-space:nowrap;margin-left:10px;}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;}
  .tab{flex:0 0 auto;font-size:13px;padding:7px 12px;border-radius:3px;
    border:1px solid var(--paper-line);background:var(--white);color:var(--ink-soft);
    cursor:pointer;position:relative;}
  .tab.active{color:var(--ink);border-color:var(--ink);font-weight:600;}
  .tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;position:relative;top:-1px;}

  .filterrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{font-size:11.5px;padding:4px 9px;border-radius:12px;border:1px solid var(--paper-line);
    background:transparent;color:var(--ink-soft);cursor:pointer;}
  .chip.active{background:var(--ink);color:var(--white);border-color:var(--ink);}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty .big{font-family:Georgia,serif;font-style:italic;font-size:18px;color:var(--ink);margin-bottom:8px;}
  .empty button{margin-top:14px;}

  .card{background:var(--white);padding:14px 14px 12px 18px;margin-bottom:12px;border-radius:3px;
    position:relative;border-bottom:1px dashed var(--paper-line);box-shadow:0 1px 0 rgba(0,0,0,0.03);cursor:pointer;}
  .card::before{content:"";position:absolute;left:6px;top:14px;width:8px;height:8px;
    border-radius:50%;background:var(--paper);border:1.5px solid var(--paper-line);}
  .card{border-left:4px solid var(--ink-soft);}
  .card.st-new{border-left-color:var(--ink-soft);}
  .card.st-progress{border-left-color:var(--blue);}
  .card.st-review{border-left-color:var(--mustard);}
  .card.st-done{border-left-color:var(--green);}
  .card.st-revision{border-left-color:var(--red);}
  .card h3{margin:0 0 4px;font-size:15px;font-weight:600;line-height:1.3;}
  .card .meta{font-size:12px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap;}
  .card .badge{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:10px;margin-top:8px;font-weight:600;}
  .badge.st-new{background:#eee9dd;color:var(--ink-soft);}
  .badge.st-progress{background:#e4eaf5;color:var(--blue);}
  .badge.st-review{background:#f5ecdd;color:var(--mustard);}
  .badge.st-done{background:#e6efe7;color:var(--green);}
  .badge.st-revision{background:#f6e5e2;color:var(--red);}

  .fab{position:fixed;bottom:22px;right:50%;transform:translateX(260px);
    width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--white);
    border:none;font-size:26px;line-height:52px;text-align:center;cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,0.25);}
  @media (max-width:560px){.fab{right:20px;transform:none;}}
  .settings-btn{position:fixed;bottom:22px;left:50%;transform:translateX(-280px);
    width:40px;height:40px;border-radius:50%;background:var(--white);color:var(--ink);
    border:1px solid var(--paper-line);font-size:16px;cursor:pointer;}
  @media (max-width:560px){.settings-btn{left:16px;transform:none;}}

  .overlay{position:fixed;inset:0;background:rgba(43,43,43,0.45);display:flex;
    align-items:flex-end;justify-content:center;z-index:50;}
  .sheet{background:var(--paper);width:100%;max-width:520px;border-radius:14px 14px 0 0;
    padding:20px 18px 26px;max-height:88vh;overflow-y:auto;border-top:2px dashed var(--paper-line);}
  .sheet h2{font-family:Georgia,serif;font-style:italic;font-size:20px;margin:0 0 16px;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin:14px 0 5px;font-weight:600;}
  input[type=text],input[type=date],input[type=email],input[type=password],textarea,select{
    width:100%;padding:10px 11px;border:1px solid var(--paper-line);border-radius:4px;
    font-size:14px;background:var(--white);color:var(--ink);font-family:inherit;}
  textarea{min-height:70px;resize:vertical;}
  .btnrow{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
  button.primary{background:var(--ink);color:var(--white);border:none;padding:11px 18px;
    border-radius:4px;font-size:14px;font-weight:600;cursor:pointer;flex:1;}
  button.primary:disabled{opacity:0.5;}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--paper-line);
    padding:11px 18px;border-radius:4px;font-size:14px;cursor:pointer;flex:1;}
  button.danger-text{background:none;border:none;color:var(--red);font-size:12.5px;
    text-decoration:underline;cursor:pointer;padding:8px 0;}
  .detail-row{margin-bottom:12px;}
  .detail-row .k{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:3px;}
  .detail-row .v{font-size:14px;line-height:1.45;}
  .desig-list{margin:10px 0 0;padding:0;list-style:none;}
  .desig-list li{display:flex;justify-content:space-between;align-items:center;
    padding:9px 0;border-bottom:1px dashed var(--paper-line);font-size:14px;}
  .desig-list li button{background:none;border:none;color:var(--red);font-size:12px;cursor:pointer;}
  .role-pick{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .role-pick button{text-align:left;padding:14px 16px;border-radius:6px;border:1px solid var(--paper-line);
    background:var(--white);font-size:15px;cursor:pointer;color:var(--ink);}
  .role-pick button b{display:block;font-size:12px;color:var(--ink-soft);font-weight:400;margin-top:2px;}
  .loading{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--white);padding:9px 16px;border-radius:20px;
    font-size:13px;z-index:99;opacity:0;transition:opacity .25s;}
  .toast.show{opacity:1;}
  .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px;}
  .authwrap{max-width:400px;margin:60px auto 0;padding:0 20px;}
  .authwrap h1{font-family:Georgia,serif;font-style:italic;font-size:26px;margin:0 0 4px;text-align:center;}
  .authwrap .sub{text-align:center;color:var(--ink-soft);font-size:13px;margin-bottom:28px;}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Загрузка…</div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAVcifT9Ip69CSuSt_8naJHr4ZbplOMtgI",
  authDomain: "v-reyse.firebaseapp.com",
  projectId: "v-reyse",
  storageBucket: "v-reyse.firebasestorage.app",
  messagingSenderId: "200272195894",
  appId: "1:200272195894:web:6139f885fb49e0e747c397"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
auth.useDeviceLanguage();
const db = firebase.firestore();
const BOARD_REF = db.collection('print_tracker').doc('shared');
const ROLE_KEY = 'print_tracker_role_v1';

const STATUSES = [
  {id:'new', label:'Новые', color:'var(--ink-soft)'},
  {id:'progress', label:'В работе', color:'var(--blue)'},
  {id:'review', label:'На проверке', color:'var(--mustard)'},
  {id:'revision', label:'На доработке', color:'var(--red)'},
  {id:'done', label:'Готово', color:'var(--green)'},
];
const STATUS_MAP = Object.fromEntries(STATUSES.map(s=>[s.id,s]));

let board = {designers:[], tasks:[]};
let role = null;
let currentTab = 'new';
let designerFilter = 'all';
let unsubBoard = null;
let boardLoaded = false;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function authErrorText(err){
  const map = {
    'auth/invalid-email':'Некорректный email',
    'auth/user-not-found':'Такого пользователя нет — зарегистрируйтесь',
    'auth/wrong-password':'Неверный пароль',
    'auth/invalid-credential':'Неверный email или пароль',
    'auth/email-already-in-use':'Такой email уже зарегистрирован — войдите',
    'auth/weak-password':'Пароль слишком короткий (минимум 6 символов)',
  };
  return map[err.code] || 'Ошибка: ' + (err.message || err.code || 'неизвестная');
}

// ---------- Экран входа ----------
function renderAuth(){
  document.getElementById('app').innerHTML = `
    <div class="authwrap">
      <h1>Трекер принтов</h1>
      <div class="sub">Войдите, чтобы видеть общие заявки</div>
      <label>Email</label>
      <input type="email" id="a-email" autocomplete="username">
      <label>Пароль</label>
      <input type="password" id="a-pass" autocomplete="current-password">
      <div class="err" id="a-err"></div>
      <div class="btnrow">
        <button class="primary" id="a-login">Войти</button>
      </div>
      <div class="btnrow">
        <button class="ghost" id="a-register">Зарегистрироваться</button>
      </div>
    </div>
  `;
  const email = document.getElementById('a-email');
  const pass = document.getElementById('a-pass');
  const err = document.getElementById('a-err');
  const loginBtn = document.getElementById('a-login');
  const regBtn = document.getElementById('a-register');
  loginBtn.onclick = ()=>{
    err.textContent='';
    if(!email.value || !pass.value){ err.textContent='Заполните оба поля'; return; }
    loginBtn.disabled=true;
    auth.signInWithEmailAndPassword(email.value.trim(), pass.value)
      .catch(e=>{ err.textContent = authErrorText(e); })
      .finally(()=>{ loginBtn.disabled=false; });
  };
  regBtn.onclick = ()=>{
    err.textContent='';
    if(!email.value || !pass.value){ err.textContent='Заполните оба поля'; return; }
    regBtn.disabled=true;
    auth.createUserWithEmailAndPassword(email.value.trim(), pass.value)
      .catch(e=>{ err.textContent = authErrorText(e); })
      .finally(()=>{ regBtn.disabled=false; });
  };
}

// ---------- Загрузка/синхронизация общей доски ----------
function startBoardSync(){
  if(unsubBoard) return;
  unsubBoard = BOARD_REF.onSnapshot(
    async(doc)=>{
      if(!doc.exists){
        try{ await BOARD_REF.set({designers:[], tasks:[]}); }catch(e){}
        board = {designers:[], tasks:[]};
      } else {
        const d = doc.data();
        board = {designers: d.designers||[], tasks: d.tasks||[]};
      }
      boardLoaded = true;
      let r = localStorage.getItem(ROLE_KEY);
      try{ role = r ? JSON.parse(r) : null; }catch(e){ role=null; }
      render();
    },
    (err)=>{
      document.getElementById('app').innerHTML = `
        <div class="empty" style="padding-top:80px;">
          <div class="big">Нет доступа к базе</div>
          ${esc(err.message || 'Firestore отклонил запрос.')}
          <br><br>Скорее всего, в настройках Firebase (Firestore → Rules) нужно разрешить
          чтение и запись коллекции <b>print_tracker</b> авторизованным пользователям.
        </div>`;
    }
  );
}
function stopBoardSync(){ if(unsubBoard){ unsubBoard(); unsubBoard=null; } boardLoaded=false; }

async function saveBoard(){
  try{
    await BOARD_REF.set({designers: board.designers, tasks: board.tasks});
  }catch(e){ toast('Не удалось сохранить: ' + (e.message||e.code||'ошибка')); }
}
function saveRole(){
  try{ localStorage.setItem(ROLE_KEY, JSON.stringify(role)); }catch(e){}
}

function isAdmin(){ return role && role.type==='admin'; }

// ---------- Экраны приложения ----------
function render(){
  const app = document.getElementById('app');
  if(!boardLoaded){ app.innerHTML = '<div class="loading">Загрузка…</div>'; return; }
  if(!role){ app.innerHTML = roleScreen(); bindRoleScreen(); return; }
  if(role.type==='designer' && !board.designers.find(d=>d.id===role.id)){
    role = null; saveRole(); app.innerHTML = roleScreen(); bindRoleScreen(); return;
  }
  app.innerHTML = mainScreen();
  bindMainScreen();
}

function roleScreen(){
  const designerButtons = board.designers.map(d=>
    `<button data-designer="${d.id}">${esc(d.name)}</button>`
  ).join('');
  return `
    <header class="top"><div><h1>Трекер принтов</h1><div class="sub">${esc(auth.currentUser && auth.currentUser.email || '')}</div></div>
      <button class="role-chip" id="logoutBtn">Выйти</button>
    </header>
    <div class="sub" style="margin-bottom:4px;">Кто вы?</div>
    <div class="role-pick">
      <button data-admin="1">Админ<b>Ставлю задачи и принимаю работу</b></button>
      ${designerButtons || '<div style="font-size:13px;color:var(--ink-soft);">Дизайнеров пока нет — войдите как админ, чтобы добавить</div>'}
    </div>
  `;
}
function bindRoleScreen(){
  const app=document.getElementById('app');
  app.querySelector('#logoutBtn').onclick=()=>auth.signOut();
  app.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>{
    role={type:'admin'}; saveRole(); currentTab='new'; render();
  });
  app.querySelectorAll('[data-designer]').forEach(b=>b.onclick=()=>{
    const d=board.designers.find(x=>x.id===b.dataset.designer);
    role={type:'designer', id:d.id, name:d.name}; saveRole(); currentTab='new'; render();
  });
}

function visibleTasks(){
  let list = board.tasks.filter(t=>t.status===currentTab);
  if(isAdmin() && designerFilter!=='all') list = list.filter(t=>t.designerId===designerFilter);
  if(!isAdmin()) list = list.filter(t=>t.designerId===role.id);
  return list.sort((a,b)=> (a.deadline||'9999').localeCompare(b.deadline||'9999'));
}

function mainScreen(){
  const tabs = STATUSES.map(s=>{
    const count = board.tasks.filter(t=>t.status===s.id && (isAdmin()|| t.designerId===role.id)).length;
    return `<div class="tab ${currentTab===s.id?'active':''}" data-tab="${s.id}">
      <span class="dot" style="background:${s.color}"></span>${s.label} (${count})
    </div>`;
  }).join('');

  const filterRow = isAdmin() && board.designers.length ? `
    <div class="filterrow">
      <button class="chip ${designerFilter==='all'?'active':''}" data-filt="all">Все дизайнеры</button>
      ${board.designers.map(d=>`<button class="chip ${designerFilter===d.id?'active':''}" data-filt="${d.id}">${esc(d.name)}</button>`).join('')}
    </div>` : '';

  const tasks = visibleTasks();
  const list = tasks.length ? tasks.map(t=>taskCard(t)).join('') : emptyState();

  return `
    <header class="top">
      <div><h1>Трекер принтов</h1><div class="sub">${isAdmin()?'Вид админа':'Дизайнер: '+esc(role.name)}</div></div>
      <button class="role-chip" id="switchRole">Сменить</button>
    </header>
    <div class="tabs">${tabs}</div>
    ${filterRow}
    <div id="taskList">${list}</div>
    ${isAdmin()?'<button class="fab" id="addTaskBtn">+</button><button class="settings-btn" id="manageDesignersBtn">⚙</button>':''}
  `;
}

function emptyState(){
  if(isAdmin() && board.designers.length===0){
    return `<div class="empty"><div class="big">Пока нет дизайнеров</div>
      Добавьте девочек, которые делают принты, чтобы начать раздавать задания.
      <br><button class="primary" id="emptyAddDesigner" style="margin-top:16px;">Добавить дизайнера</button></div>`;
  }
  if(isAdmin()) return `<div class="empty"><div class="big">Пусто</div>Заявок в этом статусе нет.</div>`;
  return `<div class="empty"><div class="big">Пусто</div>Заданий в этом статусе для вас пока нет.</div>`;
}

function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}

function taskCard(t){
  const desig = board.designers.find(d=>d.id===t.designerId);
  const st = STATUS_MAP[t.status];
  const overdue = t.deadline && t.status!=='done' && new Date(t.deadline+'T23:59:59') < new Date();
  return `
    <div class="card st-${t.status}" data-task="${t.id}">
      <h3>${esc(t.title)}</h3>
      <div class="meta">
        ${isAdmin() && desig ? `<span>${esc(desig.name)}</span>`:''}
        ${t.deadline ? `<span style="${overdue?'color:var(--red);font-weight:600;':''}">до ${fmtDate(t.deadline)}</span>`:''}
      </div>
      <span class="badge st-${t.status}">${st.label}</span>
    </div>
  `;
}

function bindMainScreen(){
  const app=document.getElementById('app');
  app.querySelector('#switchRole').onclick=()=>{ role=null; saveRole(); render(); };
  app.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{ currentTab=el.dataset.tab; render(); });
  app.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{ designerFilter=el.dataset.filt; render(); });
  app.querySelectorAll('.card').forEach(el=>el.onclick=()=>openTaskDetail(el.dataset.task));
  const addBtn = app.querySelector('#addTaskBtn'); if(addBtn) addBtn.onclick=openAddTask;
  const mgBtn = app.querySelector('#manageDesignersBtn'); if(mgBtn) mgBtn.onclick=openManageDesigners;
  const emptyAdd = app.querySelector('#emptyAddDesigner'); if(emptyAdd) emptyAdd.onclick=openManageDesigners;
}

function openSheet(html){
  const overlay=document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML=`<div class="sheet">${html}</div>`;
  overlay.onclick=(e)=>{ if(e.target===overlay) overlay.remove(); };
  document.body.appendChild(overlay);
  return overlay;
}

function openAddTask(){
  const options = board.designers.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('');
  const overlay = openSheet(`
    <h2>Новая заявка</h2>
    <label>Что нарисовать (тема / промпт для ИИ)</label>
    <textarea id="f-title" placeholder="Например: осенний принт с грибами и ежами в акварельном стиле"></textarea>
    <label>Дизайнер</label>
    <select id="f-designer">${options}</select>
    <label>Срок сдачи</label>
    <input type="date" id="f-deadline">
    <div class="btnrow">
      <button class="ghost" id="cancelAdd">Отмена</button>
      <button class="primary" id="saveAdd">Создать</button>
    </div>
  `);
  overlay.querySelector('#cancelAdd').onclick=()=>overlay.remove();
  overlay.querySelector('#saveAdd').onclick=async()=>{
    const title = overlay.querySelector('#f-title').value.trim();
    const designerId = overlay.querySelector('#f-designer').value;
    const deadline = overlay.querySelector('#f-deadline').value;
    if(!title){ toast('Опишите, что нужно нарисовать'); return; }
    if(!designerId){ toast('Выберите дизайнера'); return; }
    board.tasks.push({
      id:uid(), title, designerId, deadline, status:'new',
      createdAt:new Date().toISOString(), resultLink:'', resultNote:'', comment:''
    });
    await saveBoard();
    overlay.remove();
    currentTab='new';
    toast('Заявка создана');
  };
}

function openManageDesigners(){
  const overlay = openSheet(`
    <h2>Дизайнеры</h2>
    <ul class="desig-list" id="dlist">
      ${board.designers.map(d=>`<li>${esc(d.name)}<button data-rm="${d.id}">Удалить</button></li>`).join('') || '<li style="color:var(--ink-soft);">Список пуст</li>'}
    </ul>
    <label>Имя нового дизайнера</label>
    <input type="text" id="f-newdesig" placeholder="Например: Аня">
    <div class="btnrow">
      <button class="primary" id="addDesig">Добавить</button>
    </div>
    <div class="btnrow">
      <button class="ghost" id="closeDesig">Готово</button>
    </div>
  `);
  overlay.querySelector('#closeDesig').onclick=()=>{ overlay.remove(); };
  overlay.querySelector('#addDesig').onclick=async()=>{
    const input = overlay.querySelector('#f-newdesig');
    const name = input.value.trim();
    if(!name) return;
    board.designers.push({id:uid(), name});
    await saveBoard();
    overlay.remove();
    openManageDesigners();
  };
  overlay.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.rm;
    board.designers = board.designers.filter(d=>d.id!==id);
    await saveBoard();
    overlay.remove();
    openManageDesigners();
  });
}

function openTaskDetail(taskId){
  const t = board.tasks.find(x=>x.id===taskId);
  if(!t) return;
  const desig = board.designers.find(d=>d.id===t.designerId);
  const st = STATUS_MAP[t.status];

  let actions = '';
  if(!isAdmin() && role.id===t.designerId){
    if(t.status==='new'){
      actions = `<button class="primary" id="act-take">Взять в работу</button>`;
    } else if(t.status==='progress' || t.status==='revision'){
      actions = `
        <label>Ссылка на результат (файл / фото)</label>
        <input type="text" id="f-link" value="${esc(t.resultLink)}" placeholder="Ссылка на макет">
        <label>Комментарий (необязательно)</label>
        <textarea id="f-note" placeholder="Что сделано, есть ли варианты">${esc(t.resultNote)}</textarea>
        <button class="primary" id="act-submit" style="margin-top:14px;width:100%;">Сдать на проверку</button>
      `;
    }
  }
  if(isAdmin() && t.status==='review'){
    actions = `
      <label>Замечания (если возвращаете на доработку)</label>
      <textarea id="f-comment" placeholder="Что поправить"></textarea>
      <div class="btnrow">
        <button class="ghost" id="act-revise">На доработку</button>
        <button class="primary" id="act-accept">Принять</button>
      </div>
    `;
  }

  const overlay = openSheet(`
    <h2>${esc(t.title)}</h2>
    <div class="detail-row"><div class="k">Статус</div><div class="v">${st.label}</div></div>
    ${desig?`<div class="detail-row"><div class="k">Дизайнер</div><div class="v">${esc(desig.name)}</div></div>`:''}
    ${t.deadline?`<div class="detail-row"><div class="k">Срок</div><div class="v">${fmtDate(t.deadline)}</div></div>`:''}
    ${t.resultLink?`<div class="detail-row"><div class="k">Результат</div><div class="v">${esc(t.resultLink)}</div></div>`:''}
    ${t.resultNote?`<div class="detail-row"><div class="k">Комментарий дизайнера</div><div class="v">${esc(t.resultNote)}</div></div>`:''}
    ${t.comment?`<div class="detail-row"><div class="k">Замечания админа</div><div class="v">${esc(t.comment)}</div></div>`:''}
    ${actions}
    <div class="btnrow" style="margin-top:18px;">
      <button class="ghost" id="closeDetail">Закрыть</button>
    </div>
    ${isAdmin()?'<button class="danger-text" id="deleteTask">Удалить заявку</button>':''}
  `);
  overlay.querySelector('#closeDetail').onclick=()=>overlay.remove();

  const takeBtn = overlay.querySelector('#act-take');
  if(takeBtn) takeBtn.onclick=async()=>{ t.status='progress'; await saveBoard(); overlay.remove(); currentTab='progress'; toast('Взято в работу'); };

  const submitBtn = overlay.querySelector('#act-submit');
  if(submitBtn) submitBtn.onclick=async()=>{
    t.resultLink = overlay.querySelector('#f-link').value.trim();
    t.resultNote = overlay.querySelector('#f-note').value.trim();
    t.status='review';
    await saveBoard(); overlay.remove(); currentTab='review'; toast('Отправлено на проверку');
  };

  const acceptBtn = overlay.querySelector('#act-accept');
  if(acceptBtn) acceptBtn.onclick=async()=>{ t.status='done'; t.comment=''; await saveBoard(); overlay.remove(); currentTab='done'; toast('Принято'); };

  const reviseBtn = overlay.querySelector('#act-revise');
  if(reviseBtn) reviseBtn.onclick=async()=>{
    t.comment = overlay.querySelector('#f-comment').value.trim();
    t.status='revision';
    await saveBoard(); overlay.remove(); currentTab='revision'; toast('Возвращено на доработку');
  };

  const delBtn = overlay.querySelector('#deleteTask');
  if(delBtn) delBtn.onclick=async()=>{
    board.tasks = board.tasks.filter(x=>x.id!==t.id);
    await saveBoard(); overlay.remove(); toast('Заявка удалена');
  };
}

// ---------- Точка входа: слушаем вход/выход ----------
let authResolved = false;
auth.onAuthStateChanged(user=>{
  authResolved = true;
  if(user){
    document.getElementById('app').innerHTML = '<div class="loading">Загрузка…</div>';
    startBoardSync();
  } else {
    stopBoardSync();
    board = {designers:[], tasks:[]};
    renderAuth();
  }
});
// Если за 4 секунды Firebase так и не ответил — скорее всего, страница открыта
// в урезанном режиме (например content://downloads из уведомления о загрузке),
// где недоступно хранилище, нужное Firebase. Показываем понятную подсказку
// вместо вечной надписи «Загрузка…».
setTimeout(()=>{
  if(!authResolved){
    document.getElementById('app').innerHTML = `
      <div class="empty" style="padding-top:80px;">
        <div class="big">Не удалось подключиться</div>
        Страница слишком долго не отвечает — вероятно, она открыта в урезанном
        режиме просмотра (например, сразу из уведомления «Скачано»), где недоступно
        хранилище данных браузера.
        <br><br>Попробуйте открыть файл через сам браузер: адресная строка Chrome →
        меню (⋮) → «Файлы», либо через файловый менеджер телефона кнопкой
        «Открыть в Chrome».
      </div>`;
  }
}, 4000);
</script>
